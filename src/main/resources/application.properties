spring.application.name=einvoice-scheduler
server.port=8087

server.shutdown=graceful
management.endpoints.web.exposure.include=health,info

spring.main.keep-alive=true
spring.threads.virtual.enabled=true

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ota_einvoicing_monitor
spring.datasource.username=ota
spring.datasource.password=ota_pass

failed.retry.scheduler.expression=* */1 * * * *
failed.retry.scheduler.lock.at.least=PT1M
failed.retry.scheduler.lock.at.most=PT10M

# debug configurations
logging.level.org.springframework.security=DEBUG
logging.level.root=INFO
logging.level.com.fasterxml.jackson.databind=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG
logging.level.com.fasterxml.jackson=DEBUG
logging.level.com.aibizs.einvoice=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.http.converter=DEBUG


# Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=aibizzPazz
